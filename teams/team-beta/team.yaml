# Team declaration file — this is the ONLY file your team edits.
#
# Adding, removing, or resizing buckets, or rotating who can assume your
# role, is done here. Commit + open a PR against this file; the pipeline
# plans/applies only your team's directory.
#
# visibility has no default on purpose — you must say "public" or "private"
# for every bucket, or the plan will fail validation.

team: team-beta

# IAM principals allowed to assume this team's role (e.g. your CI/CD deploy
# role, or an EKS IRSA role ARN). At least one is required.
trusted_principal_arns:
  - "arn:aws:iam::123456789012:role/team-beta-ci-deploy"

buckets:
  - name: uploads
    visibility: private
  - name: static-assets
    visibility: public

tags:
  owner: team-beta@company.com
  cost_center: "CC-2042"
