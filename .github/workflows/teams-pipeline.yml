name: Teams pipeline (demo)

on:
  pull_request:
    paths:
      - "teams/**"
  push:
    branches: [main, master]
    paths:
      - "teams/**"

permissions:
  contents: read
  pull-requests: write # to comment the plan back on the PR

env:
  TF_VERSION: "1.9.8"

jobs:
  # ---------------------------------------------------------------------
  # Figure out which teams changed, and split them into "active" (the
  # team's directory still exists -> plan/apply) vs "removed" (the
  # directory is gone -> offboard/destroy).
  # ---------------------------------------------------------------------
  detect:
    runs-on: ubuntu-latest
    outputs:
      active: ${{ steps.split.outputs.active }}
      removed: ${{ steps.split.outputs.removed }}
      any_active: ${{ steps.split.outputs.any_active }}
      any_removed: ${{ steps.split.outputs.any_removed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed teams
        id: changed
        run: |
          if [[ -n "${{ github.event.pull_request.base.ref }}" ]]; then
            base="origin/${{ github.event.pull_request.base.ref }}"
          else
            base="${{ github.event.before }}"
          fi
          head="${{ github.event.pull_request.head.sha || github.sha }}"
          teams="$(scripts/detect-changed-teams.sh "$base" "$head")"
          echo "teams<<EOF" >> "$GITHUB_OUTPUT"
          echo "$teams" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Split into active vs removed
        id: split
        run: |
          active=() removed=()
          while IFS= read -r team; do
            [[ -z "$team" ]] && continue
            if [[ -f "teams/$team/team.yaml" ]]; then
              active+=("\"$team\"")
            else
              removed+=("\"$team\"")
            fi
          done <<< "${{ steps.changed.outputs.teams }}"

          active_json="[$(IFS=,; echo "${active[*]:-}")]"
          removed_json="[$(IFS=,; echo "${removed[*]:-}")]"

          echo "active=$active_json" >> "$GITHUB_OUTPUT"
          echo "removed=$removed_json" >> "$GITHUB_OUTPUT"
          echo "any_active=$([[ ${#active[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "any_removed=$([[ ${#removed[@]} -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # Fast, cheap, no-AWS-credentials-needed rejection of a malformed
  # team.yaml, before we ever spend time on a plan. Identical in a real
  # pipeline — this step never touches AWS either way.
  # ---------------------------------------------------------------------
  validate:
    needs: detect
    if: needs.detect.outputs.any_active == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install pyyaml
      - run: |
          python3 scripts/validate-team-config.py $(echo '${{ needs.detect.outputs.active }}' | jq -r '.[]')

  # ---------------------------------------------------------------------
  # PR: plan every changed-and-still-existing team, comment the plan back.
  # Runs for real against a local backend — no AWS account needed.
  # ---------------------------------------------------------------------
  plan:
    needs: [detect, validate]
    if: github.event_name == 'pull_request' && needs.detect.outputs.any_active == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        team: ${{ fromJson(needs.detect.outputs.active) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Real pipeline: assume a scoped deploy role via OIDC here instead.
      # - uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::123456789012:role/platform-ci-deploy
      #     aws-region: eu-west-1

      - name: terraform plan for ${{ matrix.team }} (demo — local backend, no AWS)
        run: |
          set -o pipefail
          scripts/run-team.sh "${{ matrix.team }}" plan | tee plan-output.txt

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('plan-output.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `### [DEMO] Terraform plan — \`${{ matrix.team }}\`\n\n\`\`\`\n${body.slice(-60000)}\n\`\`\``,
            });


  apply:
    needs: [detect, validate]
    if: github.event_name == 'push' && needs.detect.outputs.any_active == 'true'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJson(needs.detect.outputs.active) }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform apply for ${{ matrix.team }} (demo — plan only, nothing created)
        run: scripts/run-team.sh "${{ matrix.team }}" apply

  # ---------------------------------------------------------------------
  # Offboarding: a team's directory was deleted. In this demo, that means
  # computing and printing the destroy plan — see scripts/run-team.sh
  # — not actually destroying anything. A real pipeline always requires a
  # human approval here regardless of trigger, via environment protection.
  # ---------------------------------------------------------------------
  destroy:
    needs: detect
    if: needs.detect.outputs.any_removed == 'true'
    runs-on: ubuntu-latest
    # Real pipeline: environment: platform-teardown, with required
    # reviewers configured on that environment in repo settings.
    strategy:
      fail-fast: false
      matrix:
        team: ${{ fromJson(needs.detect.outputs.removed) }}
    steps:
      - uses: actions/checkout@v4
        with:
          # destroy needs the *old* team.yaml, which no longer exists at
          # the head commit — check out the merge-base/parent that still
          # has it instead.
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform destroy for ${{ matrix.team }} (demo — plan only, nothing destroyed)
        run: scripts/run-team.sh "${{ matrix.team }}" destroy

# ---------------------------------------------------------------------------
# A change to platform-module/ or deploy/ is a different kind of event: it
# potentially affects every team at once. That should run as its own
# workflow (e.g. plan every team in a read-only "does this diff break
# anyone" check on PR, gated more heavily on apply) rather than be folded
# into this per-team fan-out — the two have very different blast radii and
# approval needs.
# ---------------------------------------------------------------------------
